<!DOCTYPE html>
<html lang="tr">
<head>

    <link rel="stylesheet" href="style.css">

    <script src="https://s3.tradingview.com/tv.js"></script>
</head>

<body>

<nav class="navbar">

    <ul>

<script src="script.js"></script>

<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TradeAI Pro</title>

<link rel="stylesheet" href="style.css">

<script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<header class="navbar">
<div class="logo">
TradeAI Pro
</div>

<div class="menu">

<button>Dashboard</button>
<button>Markets</button>
<button>Signals</button>
<button>Scanner</button>
<button>Settings</button>

</div>
    
<div class="nav-links">

<select id="coinSelect">
    <option value="BTCUSDT">BTCUSDT</option>
    <option value="ETHUSDT">ETHUSDT</option>
    <option value="SOLUSDT">SOLUSDT</option>
    <option value="BNBUSDT">BNBUSDT</option>
    <option value="XRPUSDT">XRPUSDT</option>
</select>

<select id="timeframe">
    <option value="1">1m</option>
    <option value="5">5m</option>
    <option value="15" selected>15m</option>
    <option value="30">30m</option>
    <option value="60">1H</option>
    <option value="240">4H</option>
    <option value="1D">1D</option>
</select>

<button class="nav-btn">Scanner</button>
<button class="nav-btn">Signals</button>
<button class="nav-btn">Backtest</button>

</div>


</header>

<main class="container">
<section class="left">
<div id="tvchart"></div>

</section>

<aside class="right sidebar">

<div class="card">

<h2>AI SIGNAL</h2>

<h1 id="signal">WAIT</h1>

<div class="line"></div>

<p>Confidence</p>
<h3 id="confidence">0%</h3>

<p>Entry</p>
<h3 id="entry">-</h3>

<p>Stop Loss</p>
<h3 id="sl">-</h3>

<p>Take Profit</p>
<h3 id="tp">-</h3>

</div>

<div class="card">

<h2>Smart Money</h2>

<p>BOS</p>
<p id="bos">-</p>

<p>CHoCH</p>
<p id="choch">-</p>

<p>Order Block</p>
<p id="ob">-</p>

<p>FVG</p>
<p id="fvg">-</p>

<p>Liquidity</p>
<p id="liq">-</p>

</div>

<div class="card">

<h2>Indicators</h2>

<p>EMA 20</p>
<p id="ema20">-</p>

<p>EMA 50</p>
<p id="ema50">-</p>

<p>EMA 200</p>
<p id="ema200">-</p>

<p>RSI</p>
<p id="rsi">-</p>

<p>MACD</p>
<p id="macd">-</p>

</div>

</aside>

</main>

<script src="js/api.js"></script>
<script src="js/indicators.js"></script>
<script src="js/strategy.js"></script>
<script src="js/tradeEngine.js"></script>
<script src="js/ui.js"></script>

<script src="script.js"></script>

</body>

</html>
